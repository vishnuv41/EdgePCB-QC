/* Hardware management actions */
async function setInfMode(m) {
  try {
    S.busy = true;
    S.hwMsg = { type: 'info', text: 'Switching inference pipeline to ' + m.toUpperCase() + '...' };
    render();
    S.infCfg = await api.setInfConfig({ backend_mode: m });
    S.hwMsg = { type: 'ok', text: 'Inference pipeline successfully switched to ' + m.toUpperCase() };
    await refresh();
  } catch(e) {
    S.hwMsg = { type: 'err', text: 'Mode switch failed: ' + e.message };
  } finally {
    S.busy = false;
    render();
  }
}

async function saveThresholds() {
  const confEl = document.getElementById('cfg-conf');
  const iouEl = document.getElementById('cfg-iou');
  const maxdEl = document.getElementById('cfg-maxd');
  if(!confEl || !iouEl || !maxdEl) return;
  const conf = parseFloat(confEl.value);
  const iou = parseFloat(iouEl.value);
  const maxd = parseInt(maxdEl.value, 10);
  try {
    S.busy = true;
    S.hwMsg = { type: 'info', text: 'Saving inference parameters...' };
    render();
    S.infCfg = await api.setInfConfig({ conf_threshold: conf, iou_threshold: iou, max_detections: maxd });
    S.hwMsg = { type: 'ok', text: 'Inference thresholds updated (Conf: ' + Math.round(conf*100) + '%, IoU: ' + Math.round(iou*100) + '%, Max: ' + maxd + ')' };
  } catch(e) {
    S.hwMsg = { type: 'err', text: 'Failed to update thresholds: ' + e.message };
  } finally {
    S.busy = false;
    render();
  }
}

async function resetThresholds() {
  try {
    S.busy = true;
    S.hwMsg = { type: 'info', text: 'Resetting thresholds to factory defaults...' };
    render();
    S.infCfg = await api.resetThresholds();
    S.hwMsg = { type: 'ok', text: 'Thresholds reset to factory defaults (Conf: 25%, IoU: 45%, Max: 100).' };
  } catch(e) {
    S.hwMsg = { type: 'err', text: 'Reset failed: ' + e.message };
  } finally {
    S.busy = false;
    render();
  }
}

async function runPipelineComparison() {
  try {
    S.compBusy = true;
    S.compRes = null;
    S.hwMsg = { type: 'info', text: 'Running parity benchmark on curated PCB test board...' };
    render();
    S.compRes = await api.comparePipelines();
    S.hwMsg = { type: 'ok', text: 'Pipeline comparison test completed successfully.' };
  } catch(e) {
    S.hwMsg = { type: 'err', text: 'Comparison failed: ' + e.message };
  } finally {
    S.compBusy = false;
    render();
  }
}



async function runLlamaHardwareTest(){
  try{
    S.llamaBusy = true;
    S.llamaTestRes = null;
    render();
    const testPayload = {
      board_id: 'PCB-AUDIT-001',
      decision: 'REJECT',
      defects: [
        { class: 'open_circuit', severity: 'critical', confidence: 0.93, bbox: [100, 150, 140, 190] }
      ],
      rule_id: 'RULE-CRIT-OPEN',
      rule_description: 'Critical open circuit detected on trace'
    };
    const res = await api.generateAdvisory(testPayload, 'auto');
    S.llamaTestRes = res;
    if(res && res.advisory && res.advisory.generated_text){
      S.hwMsg = { type: 'ok', text: 'Llama 3.2 1B neural inference completed (' + (res.metrics ? (res.metrics.latency_ms/1000).toFixed(1) + 's, ' + res.metrics.tokens_per_second + ' tok/s' : '') + ')' };
    }
  }catch(e){
    S.hwMsg = { type: 'err', text: 'Llama test failed: ' + e.message };
  }finally{
    S.llamaBusy = false;
    render();
  }
}

async function runLlamaAdvisoryForBoard(){
  if(!S.rec) return;
  try{
    S.wsLlamaBusy = true;
    render();
    const res = await api.generateAdvisory(S.rec, 'auto');
    if(res && res.advisory){
      if(res.advisory.generated_text){
        S.rec.advisory.generated_text = res.advisory.generated_text;
      }
      if(res.advisory.confidence_caveat){
        S.rec.advisory.confidence_caveat = res.advisory.confidence_caveat;
      }
      if(res.metrics){
        S.rec.advisory_metrics = res.metrics;
      }
    }
  }catch(e){
    alert('Llama advisory generation failed: ' + e.message);
  }finally{
    S.wsLlamaBusy = false;
    render();
  }
}

V.analytics=function(){
 const s = S.st || { decisions: { PASS: 0, INSPECT: 0, REJECT: 0 }, total: 0, freq: { open_circuit: 0, short_circuit: 0, mouse_bite: 0, spur: 0, spurious_copper: 0, pin_hole: 0 }, heatmap: [468,110,2,341,197,35,239,86,113], total_defects: 1591 };
 const v = S.rv || { total_reviewed: 0, confirmed_defects: 0, false_calls: 0, uncertain: 0, false_call_rate_percent: 0, class_breakdown: {} };
 const D = s.decisions || { PASS: 0, INSPECT: 0, REJECT: 0 }, tot = s.total || 1, C = 2*Math.PI*60, col = { PASS: '#17a673', INSPECT: '#f0a30a', REJECT: '#e5392d' }, f = Object.entries(s.freq || {}).sort((a,b)=>b[1]-a[1]), sum = f.reduce((a,b)=>a+b[1],0) || 1;
 let off=0;const arcs=Object.entries(D).map(([k,n])=>{const l=n/tot*C,e=`<circle cx='90' cy='90' r='60' fill='none' stroke='${col[k]}' stroke-width='26' stroke-dasharray='${l} ${C-l}' stroke-dashoffset='${-off}' transform='rotate(-90 90 90)'/>`;off+=l;return e}).join('');

 let cum=0;const bars=f.map(([k,n],i)=>{

   return{

   };
 });
 const pts=S.lg.slice(0,12).reverse().map(x=>x.defects),mean=pts.length?pts.reduce((a,b)=>a+b,0)/pts.length:0,ucl=mean+3*Math.sqrt(mean),my=Math.max(ucl,...pts,1)*1.15,yy=n=>150-n/my*130,xx=i=>30+i*(410/Math.max(1,pts.length-1));
 const sevs={CRITICAL:0,MAJOR:0,MINOR:0};f.forEach(([k,n])=>{const sev=SEV[k]||'MINOR';sevs[sev]=(sevs[sev]||0)+n});const sc={CRITICAL:'#e5392d',MAJOR:'#f0a30a',MINOR:'#8a8980'};
 
 const sessionCells=Array(9).fill(0),H=(S.hist||[]);
 H.forEach(r=>r.defects.forEach(d=>{const cx=(d.bbox[0]+d.bbox[2])/2,cy=(d.bbox[1]+d.bbox[3])/2;sessionCells[Math.min(2,cy/240|0)*3+Math.min(2,cx/427|0)]++}));

 return`<div class='chips'><button class='btn ${S.scope==='real'?'dk':'gh'}' onclick='S.scope="real";refresh();render()'>Production only</button><button class='btn ${S.scope==='all'?'dk':'gh'}' onclick='S.scope="all";refresh();render()'>All records (401 boards)</button>${CFG.mock?'<span class="note">Demo figures</span>':''}</div>
 <div class='grid g4'>${kpi('✓','First-pass yield',(D.PASS/tot*100).toFixed(1)+'%','PASS ÷ all boards, n = '+tot)}${kpi('✕','Reject rate',(D.REJECT/tot*100).toFixed(1)+'%',D.REJECT+' boards')}${kpi('#','Defects per board',(sum/tot).toFixed(2),sum+' defects total')}${kpi('!','False-call rate',v.false_call_rate_percent+'%','n = '+v.total_reviewed+' reviewed')}</div>
 <div class='grid g2' style='margin-top:16px'><div class='card'><h2>Quality decisions</h2><p class='s'>PASS, INSPECT, REJECT distribution</p><div style='display:flex;gap:20px;align-items:center;flex-wrap:wrap'><svg width='170' height='170' viewBox='0 0 180 180' role='img' aria-label='Decision donut'><circle cx='90' cy='90' r='60' fill='none' stroke='var(--line)' stroke-width='26'/>${arcs}<text x='90' y='88' text-anchor='middle' font-size='26' font-weight='700' fill='var(--ink)'>${tot}</text><text x='90' y='106' text-anchor='middle' font-size='11' fill='var(--mut)'>boards</text></svg><div>${Object.entries(D).map(([k,n])=>`<div><span class='dot' style='background:${col[k]}'></span>${k}: <b>${n}</b> (${(n/tot*100).toFixed(1)}%)</div>`).join('')}</div></div></div>

 <div class='grid g2' style='margin-top:16px'><div class='card'><h2>Defects per board (c-chart)</h2><p class='s'>Last ${pts.length} boards. Points above the red line signal a process shift.</p>${pts.length>1?`<svg viewBox='0 0 470 170' width='100%' role='img' aria-label='c-chart'><line x1='30' x2='440' y1='${yy(mean)}' y2='${yy(mean)}' stroke='var(--mut)' stroke-dasharray='4 4'/><line x1='30' x2='440' y1='${yy(ucl)}' y2='${yy(ucl)}' stroke='#e5392d' stroke-dasharray='4 4'/><text x='440' y='${yy(ucl)-4}' font-size='9' text-anchor='end' fill='#e5392d'>UCL ${ucl.toFixed(1)}</text><text x='440' y='${yy(mean)-4}' font-size='9' text-anchor='end' fill='var(--mut)'>mean ${mean.toFixed(1)}</text><polyline fill='none' stroke='#f1efe7' stroke-width='2' points='${pts.map((n,i)=>xx(i)+','+yy(n)).join(' ')}'/>${pts.map((n,i)=>`<circle cx='${xx(i)}' cy='${yy(n)}' r='5' fill='${n>ucl?'#e5392d':'#17a673'}'/>`).join('')}</svg>`:'<p class="note">Needs at least two inspections.</p>'}</div>
 <div class='card'><div class='ch'><h2>Where defects occur</h2><div class='tabs' style='margin:0'><button class='${S.hmScope==="all"?"on":""}' onclick='S.hmScope="all";render()'>All DB (${tot} boards)</button><button class='${S.hmScope==="session"?"on":""}' onclick='S.hmScope="session";render()'>Session (${H.length} boards)</button></div></div><p class='s'>3&times;3 board spatial defect density (${totalHmDefects} defect centroids mapped)</p><div style='display:grid;grid-template-columns:repeat(3,1fr);gap:8px;'>${displayCells.map((n,i)=>`<div style='background:rgba(240,72,62,${0.08+0.82*n/cm});border:1px solid rgba(240,72,62,0.3);border-radius:10px;padding:12px 6px;text-align:center;'><b style='font-size:18px;display:block;'>${n}</b><span style='font-size:10px;color:var(--mut);text-transform:uppercase;'>${zoneNames[i]}</span><br><small style='font-size:10px;color:#f0a30a;'>${(n/totalHmDefects*100).toFixed(1)}%</small></div>`).join('')}</div></div></div>
 <div class='grid g2' style='margin-top:16px'><div class='card'><h2>Severity mix</h2><p class='s'>All recorded defects</p><div class='tl' style='height:26px'>${Object.entries(sevs).map(([k,n])=>`<span style='width:${n/sum*100}%;background:${sc[k]}'></span>`).join('')}</div><div class='lg'>${Object.entries(sevs).map(([k,n])=>`<span><i style='background:${sc[k]}'></i>${k} ${n}</span>`).join('')}</div></div>
 <div class='card'><h2>Review quality</h2><p class='s'>Where the model raises false calls</p><table><thead><tr><th>Class</th><th>Reviewed</th><th>False calls</th><th>Rate</th></tr></thead><tbody>${Object.entries(v.class_breakdown || {}).map(([k,x])=>{const a=(x.reviewed!==undefined?x.reviewed:(x[0]||0)),b=(x.false_calls!==undefined?x.false_calls:(x[1]||0));return`<tr><td>${k}</td><td>${a}</td><td>${b}</td><td>${a?(b/a*100).toFixed(1):'0.0'}%</td></tr>`}).join('') || '<tr><td colspan="4" class="note">No verified items yet.</td></tr>'}</tbody></table></div></div>`};
